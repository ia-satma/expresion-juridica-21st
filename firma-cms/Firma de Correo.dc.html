<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital@1&display=swap">
<style>
@font-face{font-family:"EJ Caslon";src:url("assets/fonts/libre-caslon-italic-subset.otf") format("opentype");font-style:italic;font-weight:400;}
@font-face{font-family:"EJ Bahnschrift";src:url("assets/fonts/bahnschrift-subset.otf") format("opentype");font-weight:400;}
html,body{margin:0;background:#fff;}
a{color:#141A3A;text-decoration:none;}
a:hover{color:#B08D57;}
</style>
</helmet>
<div data-screen-label="Firma" style="position:relative;width:100%;aspect-ratio:2087.971 / 767.057;container-type:inline-size;overflow:hidden;background:#ffffff;">
  <img src="assets/firma-fondo.png" alt="Expresión Jurídica Consultores" style="position:absolute;left:0;top:0;width:100%;height:100%;display:block;">
  <div style="position:absolute;left:42.674%;top:13.866%;white-space:nowrap;line-height:1;font-family:'EJ Caslon','Libre Caslon Text',Georgia,serif;font-style:italic;font-weight:400;font-size:3.8314cqw;word-spacing:-0.041em;color:#B08D57;">{{ nombre }}</div>
  <div style="position:absolute;left:42.394%;top:28.102%;white-space:nowrap;line-height:1;font-family:'EJ Bahnschrift',Bahnschrift,'DIN Alternate',sans-serif;font-weight:400;font-size:2.2547cqw;color:#0C112B;">{{ cargo }}</div>
  <div style="position:absolute;left:47.536%;top:50.754%;white-space:nowrap;line-height:1;font-family:'EJ Bahnschrift',Bahnschrift,'DIN Alternate',sans-serif;font-weight:400;font-size:2.0594cqw;letter-spacing:-0.019em;word-spacing:0.019em;color:#141A3A;">{{ telefono }}</div>
  <div style="position:absolute;left:47.536%;top:64.443%;white-space:nowrap;line-height:1;font-family:'EJ Bahnschrift',Bahnschrift,'DIN Alternate',sans-serif;font-weight:400;font-size:2.0594cqw;letter-spacing:-0.019em;word-spacing:0.019em;color:#141A3A;">{{ correo }}</div>
  <div style="position:absolute;left:47.536%;top:76.853%;white-space:nowrap;line-height:1;font-family:'EJ Bahnschrift',Bahnschrift,'DIN Alternate',sans-serif;font-weight:400;font-size:2.0594cqw;letter-spacing:-0.019em;word-spacing:0.019em;color:#141A3A;">{{ direccion1 }}</div>
  <div style="position:absolute;left:47.536%;top:82.863%;white-space:nowrap;line-height:1;font-family:'EJ Bahnschrift',Bahnschrift,'DIN Alternate',sans-serif;font-weight:400;font-size:2.0594cqw;letter-spacing:-0.019em;word-spacing:0.019em;color:#141A3A;">{{ direccion2 }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1044,&quot;height&quot;:384},
&quot;nombre&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nombre Apellido&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;cargo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Socio Fundador&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;telefono&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;00 0000 0000&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;correo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;expresionjuridica@live.com&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;direccion1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Boulevard Europa No. 33,&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;direccion2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fraccionamiento Montemagno, Xalapa, Veracruz.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      nombre: p.nombre ?? 'Nombre Apellido',
      cargo: p.cargo ?? 'Socio Fundador',
      telefono: p.telefono ?? '00 0000 0000',
      correo: p.correo ?? 'expresionjuridica@live.com',
      direccion1: p.direccion1 ?? 'Boulevard Europa No. 33,',
      direccion2: p.direccion2 ?? 'Fraccionamiento Montemagno, Xalapa, Veracruz.'
    };
  }
}
</script>
</body>
</html>
